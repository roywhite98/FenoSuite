# UNet + 编码器（如 ResNet）分割
# root_dir 由 UI「数据目录」或命令行指定，不在此必填。
# 图像与 mask 可同目录用命名区分（xxx.png / xxx_mask.png），或使用子文件夹（可选）。

experiment_name: root_unet_resnet50

data:
  # root_dir: 由界面/命令行传入，此处仅 CLI 默认
  root_dir: ./workspace/datasets/data
  # 子文件夹（可选）：留空或 "." 表示同目录，按命名区分（图像 stem + mask_suffix + mask_ext）
  images_dir: "images"
  masks_dir: "masks"
  mask_suffix: "_mask"
  train_val_split: 0.8
  # 图像格式：仅写 image_ext 则只认该后缀；写 image_extensions: [.png, .jpg, .tif, .tiff, .gif, ...] 可多格式
  image_ext: .tif
  mask_ext: .png

train:
  epochs: 500
  batch_size: 4
  num_workers: 4
  lr: 1.0e-3
  weight_decay: 1.0e-4
  amp: true
  save_dir: ./workspace/runs/training
  log_interval: 10
  patch_size: [512, 512]
  oversample_foreground: 1.0
  undersample_background: 1.0
  max_grad_norm: 12.0
  lr_schedule: poly
  poly_power: 0.8
  step_size: 30
  step_gamma: 0.1
  plateau_patience: 10
  plateau_factor: 0.5
  early_stop_patience: 50
  enable_augmentation: true
  enable_visualization: true

model:
  name: unet
  encoder_name: resnet50
  encoder_weights: imagenet
  in_channels: 3
  classes: 1
  window_size: 8

loss:
  type: bce_dice
  bce_weight: 0.5
  dice_weight: 0.5
  pos_weight: 3.0
  use_weight_mask: false
  foreground_weight: 3.0

predict:
  threshold: 0.5
  remove_small_objects: 50
  save_prob: false
