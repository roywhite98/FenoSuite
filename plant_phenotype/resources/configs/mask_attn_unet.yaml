# 带窗口注意力的 U-Net

experiment_name: root_mask_attn_unet

data:
  root_dir: ./workspace/datasets/data
  images_dir: "images"
  masks_dir: "masks"
  mask_suffix: "_mask"
  train_val_split: 0.8
  image_ext: .tif
  mask_ext: .png

train:
  epochs: 100
  batch_size: 4
  num_workers: 4
  lr: 1.0e-3
  weight_decay: 1.0e-4
  amp: true
  save_dir: ./workspace/runs/mask_attn_unet
  log_interval: 10
  patch_size: [512, 512]
  oversample_foreground: 1.0
  undersample_background: 1.0
  max_grad_norm: 12.0
  lr_schedule: poly
  poly_power: 0.8
  early_stop_patience: 20
  enable_augmentation: true
  enable_visualization: true

model:
  name: mask_attn_unet
  encoder_name: resnet50
  in_channels: 3
  classes: 1
  window_size: 8

loss:
  type: bce_dice
  bce_weight: 0.5
  dice_weight: 0.5
  pos_weight: 3.0
  use_weight_mask: false
  foreground_weight: 3.0

predict:
  threshold: 0.5
  remove_small_objects: 50
  save_prob: false
